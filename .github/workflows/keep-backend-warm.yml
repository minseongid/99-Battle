name: Keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf --max-time 60 --retry 2 --retry-delay 10 --retry-all-errors https://nine9-battle.onrender.com/api/rooms/public
